{{define "content"}}
<section class="card narrow">
<h1>Cambio password</h1>
{{if .User.MustChange}}<p class="msg warn">Stai usando una password temporanea: scegline una personale per continuare.</p>{{end}}
<form method="post" action="/password" class="stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>Password attuale <input type="password" name="current" required autofocus autocomplete="current-password"></label>
  <label>Nuova password (almeno 10 caratteri) <input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
  <label>Ripeti la nuova password <input type="password" name="password2" required minlength="10" autocomplete="new-password"></label>
  <button class="primary">Salva</button>
</form>
</section>
{{end}}

{{define "content"}}
<section class="card narrow">
<h1>Accesso</h1>
<form method="post" action="/login" class="stack">
  <label>Nome utente <input name="username" required autofocus autocomplete="username"></label>
  <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
  <button class="primary">Entra</button>
</form>
<p class="muted">Password dimenticata? Chiedi a un amministratore di reimpostarla.</p>
</section>
{{end}}

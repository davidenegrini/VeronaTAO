# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formattazione
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compila l'eseguibile
        shell: bash
        run: ./packaging/build.sh
      - name: Compila l'installer
        shell: pwsh
        run: |
          $v = (git describe --tags --always) -replace '^v', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\veronatao.iss
      - uses: actions/upload-artifact@v4
        with:
          name: VeronaTAO-windows
          path: |
            dist/VeronaTAO.exe
            dist/VeronaTAO-Setup.exe
